# Servidor
server.port=8080

# Base de datos H2 (modo archivo)
spring.datasource.url=jdbc:h2:file:./data/taskflow;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT
jwt.secret=TaskFlowSecretKeyParaFirmaDeTokensJWT2026Segura!
jwt.expiration=3600000

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# Usuario ADMIN inicial (solo desarrollo; cambiar antes de desplegar)
taskflow.admin.usuario=admin
taskflow.admin.correo=admin@taskflow.com
taskflow.admin.contrasena=Admin12345

# CORS: orígenes permitidos para el frontend (separados por coma)
taskflow.cors.allowed-origins=http://localhost:5173
